        tailwind.config = {
            darkMode: 'class',

                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: 'var(--primary-color)',
                        'primary-light': 'var(--primary-light)',
                        'primary-dark': 'var(--primary-dark)',

                    boxShadow: {
                        'glow': '0 0 20px var(--primary-light)',

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
        }

        [data-theme="indigo"] { --primary-color: #4f46e5; --primary-light: #a5b4fc; --primary-dark: #3730a3; }
        [data-theme="violet"] { --primary-color: #7c3aed; --primary-light: #c4b5fd; --primary-dark: #5b21b6; }
        [data-theme="rose"]   { --primary-color: #e11d48; --primary-light: #fda4af; --primary-dark: #9f1239; }
        [data-theme="emerald"]{ --primary-color: #059669; --primary-light: #6ee7b7; --primary-dark: #065f46; }
        [data-theme="amber"]  { --primary-color: #d97706; --primary-light: #fcd34d; --primary-dark: #92400e; }

        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(circle at 10% 20%, #f1f5f9 0%, transparent 20%), 
                              radial-gradient(circle at 90% 80%, #f1f5f9 0%, transparent 20%);
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .slide-in { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* Accordion Styles */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        .accordion-open .accordion-content {
            max-height: 3000px; 
            opacity: 1;
        }
        .accordion-icon { transition: transform 0.3s ease; }
        .accordion-open .accordion-icon { transform: rotate(180deg); }
        
        .highlight-update {
            animation: highlightUpdate 0.5s ease-out;
        }
        @keyframes highlightUpdate {
            0% { background-color: rgba(16, 185, 129, 0.1); }
            100% { background-color: transparent; }
        }

        /* Drag Styles */
        .drop-target {
            background-color: rgba(var(--primary-color), 0.05);
            border: 2px dashed var(--primary-light);
            border-radius: 1rem;
            position: relative;
        }
        .grab-handle { cursor: grab; }
        .grab-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white transition-colors duration-500" data-theme="indigo">

    // --- PARSER ---
    function parseRawData() {
        const weekRegex = /Semana\s+\d+\s+-\s+\d{2}\/\d{2}\/\d{4}/gi;
        const splitData = RAW_TEXT.split(weekRegex);
        const matches = RAW_TEXT.match(weekRegex);

        if (splitData[0].trim() === '') splitData.shift();

        state.rawSchedule = matches.map((weekHeader, index) => {
            const rawContent = splitData[index];
            const parts = weekHeader.split('-');
            const title = parts[0].trim();
            
            const subjects = [];
            const lines = rawContent.split('\n').filter(line => line.trim() !== '');

            lines.forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex > -1) {
                    let subjectName = line.substring(0, colonIndex).trim();
                    let cleanName = subjectName;
                    if (subjectName.includes("Física")) cleanName = "Física";
                    if (subjectName.includes("Biologia")) cleanName = "Biologia";

                    const topicsRaw = line.substring(colonIndex + 1).trim();
                    const cleanTopics = topicsRaw.replace(/\.$/, '').split(',').map(t => t.trim()).filter(t => t !== '');
                    
                    if (cleanTopics.length > 0) {
                        subjects.push({ 
                            fullName: subjectName, 
                            categoryName: cleanName, 
                            topics: cleanTopics 
                        });
                    }
                }
            });

            return { id: `raw-week-${index}`, index, title, subjects };
        });
    }

    // --- CORE ENGINE: ALGORITMO DE DISTRIBUIÇÃO V6.6 ---
    
    function getWeekLayout(weekIndex) {
        // Forçar recálculo nesta versão para aplicar nova lógica
        if (state.calendarCache[weekIndex]) {
            return state.calendarCache[weekIndex];
        }

        const weekData = state.rawSchedule[weekIndex];
        const studyDays = state.settings.studyDays;
        const numDays = studyDays.length;
        
        if (numDays === 0) return []; 

        // 1. Coletar Matérias
        let subjectBuckets = {};

        weekData.subjects.forEach(sub => {
            if (!state.settings.selectedSubjects.includes(sub.categoryName) && !state.settings.selectedSubjects.includes(sub.fullName)) return;
            if (sub.categoryName === 'Biologia') {
                if (state.settings.bioTeacher === 'landim' && sub.fullName.includes('Samuel')) return;
                if (state.settings.bioTeacher === 'samuel' && sub.fullName.includes('Landim')) return;
            }

            if (!subjectBuckets[sub.categoryName]) subjectBuckets[sub.categoryName] = [];
            
            sub.topics.forEach(t => {
                subjectBuckets[sub.categoryName].push({
                    subject: sub.categoryName,
                    fullName: sub.fullName,
                    topic: t,
                    id: `${weekData.id}-${sub.categoryName}-${t}`
                });
            });
        });

        // 2. Preparar Dias
        let days = Array.from({ length: numDays }, () => []);
        
        const heavyList = Object.keys(subjectBuckets).filter(s => HEAVY_SUBJECTS.includes(s));
        const otherList = Object.keys(subjectBuckets).filter(s => !HEAVY_SUBJECTS.includes(s));

        // A. Distribuir Pesadas
        let heavyCursor = 0;
        heavyList.forEach(subj => {
            const items = subjectBuckets[subj];
            if (items.length > 6 && numDays >= 2) {
                 const half = Math.ceil(items.length / 2);
                 days[heavyCursor].push(...items.slice(0, half));
                 days[(heavyCursor + 1) % numDays].push(...items.slice(half));
            } else {
                 days[heavyCursor].push(...items);
            }
            heavyCursor = (heavyCursor + 1) % numDays;
        });

        // B. Distribuir o Resto (Preencher os dias mais vazios)
        otherList.forEach(subj => {
            let bestDay = 0;
            let minSubjects = 999;
            for(let i=0; i<numDays; i++) {
                const uniqueSubjects = new Set(days[i].map(item => item.subject)).size;
                if (uniqueSubjects < minSubjects) {
                    minSubjects = uniqueSubjects;
                    bestDay = i;
                }
            }
            days[bestDay].push(...subjectBuckets[subj]);
        });

        state.calendarCache[weekIndex] = days;
        saveState();
        return days;
    }

    function getRealDatesForWeek(weekIndex) {
        let [d, m, y] = "30/11/2025".split('/');
        let baseDate = new Date(y, m - 1, d);
        baseDate.setDate(baseDate.getDate() + (weekIndex * 7));
        
        let realDates = [];
        let currentCheck = new Date(baseDate);
        
        for(let i=0; i<7; i++) {
            if (state.settings.studyDays.includes(currentCheck.getDay())) {
                realDates.push(new Date(currentCheck));
            }
            currentCheck.setDate(currentCheck.getDate() + 1);
        }
        return realDates;
    }

    function handleDragStart(e, topicId, dayIndex) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', JSON.stringify({id: topicId, dayIdx: dayIndex}));
        e.target.style.opacity = '0.4';
    }

    function handleDragEnd(e) {
        e.target.style.opacity = '1';
        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('bg-primary/5', 'border-primary/50'));
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const zone = e.currentTarget;
        zone.classList.add('bg-primary/5', 'border-primary/50');
    }

    function handleDragLeave(e) {
        const zone = e.currentTarget;
        zone.classList.remove('bg-primary/5', 'border-primary/50');
    }

    function handleDrop(e, targetDayIndex) {
        e.preventDefault();
        const zone = e.currentTarget;
        zone.classList.remove('bg-primary/5', 'border-primary/50');
        
        try {
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            const topicId = data.id;
            const sourceDayIdx = data.dayIdx;

            if (sourceDayIdx === targetDayIndex) return;

            const weekLayout = state.calendarCache[state.activeWeekIndex];
            const sourceDayList = weekLayout[sourceDayIdx];
            const itemIndex = sourceDayList.findIndex(i => i.id === topicId);
            
            if (itemIndex > -1) {
                const [movedItem] = sourceDayList.splice(itemIndex, 1);
                weekLayout[targetDayIndex].push(movedItem);
                saveState();
                renderActiveWeek(); 
            }
        } catch(err) {
            console.error("Drop error", err);
        }
    }

    function moveSubjectToNextDay(subjectName, currentDayIdx) {
        const layout = state.calendarCache[state.activeWeekIndex];
        const numDays = state.settings.studyDays.length;
        
        if (numDays <= 1) {
            alert("Você só configurou um dia de estudo. Não é possível mover para outro dia nesta semana.");
            return;
        }
        
        let nextDayIdx = (currentDayIdx + 1) % numDays;
        
        const dayItems = layout[currentDayIdx];
        const itemsToMove = dayItems.filter(i => i.subject === subjectName);
        const itemsToKeep = dayItems.filter(i => i.subject !== subjectName);
        
        if (itemsToMove.length === 0) return;

        layout[currentDayIdx] = itemsToKeep;
        layout[nextDayIdx].push(...itemsToMove);
        
        saveState();
        renderActiveWeek();
        triggerConfetti();
    }

                    <div class="text-right hidden md:block">
                        <span class="text-xs font-bold text-slate-400 uppercase">Conclusão</span>
                        <div class="text-2xl font-bold text-primary" id="week-percent">0%</div>
                    </div>
                </div>
                <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div id="local-bar" class="h-full bg-primary transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-8 pb-20">
        `;

        layout.forEach((dayItems, dayIndex) => {
            const dateObj = realDates[dayIndex] || new Date();
            const dayName = WEEKDAYS[dateObj.getDay()];
            const dateStr = dateObj.toLocaleDateString('pt-BR');
            const isToday = new Date().toDateString() === dateObj.toDateString();

            html += `
                <div class="slide-in transition-all duration-200 border-2 border-transparent rounded-2xl drop-target" 
                     style="animation-delay: ${dayIndex * 0.1}s"
                     ondragover="handleDragOver(event)" 
                     ondragleave="handleDragLeave(event)" 
                     ondrop="handleDrop(event, ${dayIndex})">
                     
                    <div class="flex items-center justify-between mb-4 px-2 border-b border-slate-100 pb-2">
                        <h3 class="font-bold text-xl text-slate-700 flex items-center gap-2">
                            ${isToday ? '<span class="bg-primary text-white text-xs px-2 py-0.5 rounded uppercase">Hoje</span>' : ''}
                            ${dayName}
                        </h3>
                        <span class="text-slate-400 font-medium text-sm bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">${dateStr}</span>
                    </div>
                    
                    <div class="space-y-4">
            `;

            if (dayItems.length === 0) {
                html += `<div class="p-6 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">Dia Livre! (Nenhuma matéria agendada)</div>`;
            } else {
                const topicsBySubject = {};
                dayItems.forEach(item => {
                    if (!topicsBySubject[item.subject]) topicsBySubject[item.subject] = [];
                    topicsBySubject[item.subject].push(item);
                });

                for (const [subject, items] of Object.entries(topicsBySubject)) {
                    const icon = SUBJECT_ICONS[subject] || "ph-book-bookmark";
                    const boxId = `acc-${state.activeWeekIndex}-${dayIndex}-${subject.replace(/\s+/g, '')}`;
                    const doneCount = items.filter(i => state.progress[i.id]).length;
                    const totalCount = items.length;
                    const isComplete = doneCount === totalCount;

                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden group transition-all hover:shadow-md" id="${boxId}-container">
                            <div class="w-full flex items-center bg-slate-50/30 hover:bg-white transition-colors pr-4">
                                <button onclick="toggleAccordion('${boxId}')" class="flex-1 px-5 py-4 flex items-center gap-4 text-left">
                                    <div class="w-12 h-12 rounded-xl ${isComplete ? 'bg-emerald-100 text-emerald-600' : 'bg-white border border-slate-100 text-primary shadow-sm'} flex items-center justify-center text-2xl icon-container shrink-0 transition-all">
                                        <i class="ph-fill ${icon}"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-base uppercase tracking-wide">${subject}</h4>
                                        <p class="text-xs text-slate-400 count-text mt-0.5 font-semibold">${doneCount}/${totalCount} concluídas</p>
                                    </div>
                                </button>
                                
                                <div class="flex items-center gap-2 border-l pl-3 border-slate-200 h-10">
                                    <button onclick="moveSubjectToNextDay('${subject}', ${dayIndex})" class="group/move flex flex-col items-center justify-center w-16 py-1 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-primary transition-colors" title="Adiar para amanhã">
                                        <i class="ph-bold ph-arrow-bend-down-right text-lg mb-0.5 group-hover/move:translate-x-1 transition-transform"></i>
                                        <span class="text-[9px] font-bold uppercase tracking-wider">Adiar</span>
                                    </button>
                                    <button onclick="toggleAccordion('${boxId}')" class="p-2 text-slate-300 hover:text-slate-500 accordion-icon">
                                        <i class="ph-bold ph-caret-down text-lg"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div id="${boxId}" class="accordion-content bg-white">
                                <div class="p-3 space-y-2 border-t border-slate-50">
                    `;

                    items.forEach(t => {
                        const isChecked = !!state.progress[t.id];
                        // --- FIXED: Added Labels for Clickability ---
                        html += `
                            <div draggable="true" 
                                 ondragstart="handleDragStart(event, '${t.id}', ${dayIndex})" 
                                 ondragend="handleDragEnd(event)"
                                 class="checkbox-wrapper flex items-start gap-4 p-3 rounded-xl hover:bg-slate-50 transition-all select-none border border-transparent hover:border-slate-100 group/item">
                                
                                <!-- Checkbox Label -->
                                <label class="mt-0.5 relative cursor-pointer shrink-0">
                                    <input type="checkbox" class="peer sr-only" ${isChecked ? 'checked' : ''} onchange="toggleItem(this, '${t.id}')">
                                    <div class="w-6 h-6 border-2 border-slate-300 rounded-lg peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center shadow-sm hover:scale-110">
                                        <i class="ph-bold ph-check text-white text-sm opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                                    </div>
                                </label>

                                <!-- Text Label (Clickable) -->
                                <label class="text-sm font-medium text-slate-600 peer-checked:text-slate-400 peer-checked:line-through transition-colors leading-relaxed flex-1 cursor-pointer" onclick="this.previousElementSibling.querySelector('input').click()">
                                    ${t.topic}
                                </label>
                                
                                <!-- Drag Handle -->
                                <div class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-primary p-1 grab-handle" onmousedown="event.stopPropagation()">
                                    <i class="ph-bold ph-dots-six-vertical"></i>
                                </div>
                            </div>
                        `;
                    });

                    html += `   </div>
                            </div>
                        </div>
                    `;
                }
            }

            html += `</div></div>`;
        });

        html += `</div>`;
        container.innerHTML = html;
        updateLocalStats();
    }

    function toggleAccordion(id) {
        const container = document.getElementById(id + '-container');
        if (container.classList.contains('accordion-open')) {
            container.classList.remove('accordion-open');
        } else {
            container.classList.add('accordion-open');
        }
    }

    function toggleItem(checkbox, id) {
        const isChecked = checkbox.checked;
        if (isChecked) state.progress[id] = true;
        else delete state.progress[id];
        saveState();

        // Visual Feedback (Fast)
        const wrapper = checkbox.closest('.checkbox-wrapper');
        
        // Flash Effect
        wrapper.classList.add('highlight-update');
        setTimeout(() => wrapper.classList.remove('highlight-update'), 500);

        // Text Strikethrough
        // We need to find the label next to the checkbox label
        const textLabel = wrapper.querySelector('label:nth-of-type(2)'); 
        if (isChecked) {
            textLabel.classList.add('text-slate-400', 'line-through');
            textLabel.classList.remove('text-slate-600');
        } else {
            textLabel.classList.remove('text-slate-400', 'line-through');
            textLabel.classList.add('text-slate-600');
        }

        // Update Count in Header
        const box = wrapper.closest('.bg-white.rounded-xl');
        if (box) {
            const allChecks = box.querySelectorAll('input[type="checkbox"]');
            const checkedCount = Array.from(allChecks).filter(c => c.checked).length;
            box.querySelector('.count-text').innerText = `${checkedCount}/${allChecks.length} concluídas`;
            
            const iconDiv = box.querySelector('.icon-container');
            if (checkedCount === allChecks.length) {
                 iconDiv.className = "w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl icon-container shrink-0 transition-all";
            } else {
                 iconDiv.className = "w-12 h-12 rounded-xl bg-white border border-slate-100 text-primary shadow-sm flex items-center justify-center text-2xl icon-container shrink-0 transition-all";
            }
        }

        updateLocalStats();
        updateGlobalProgress();
    }

    function updateLocalStats() {
        const layout = state.calendarCache[state.activeWeekIndex] || [];
        let total = 0, done = 0;
        layout.flat().forEach(t => {
            total++;
            if (state.progress[t.id]) done++;
        });
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);
        
        const bar = document.getElementById('local-bar');
        const text = document.getElementById('week-percent');
        if(bar) bar.style.width = `${percent}%`;
        if(text) text.innerText = `${percent}%`;
        
        if (percent === 100 && total > 0) triggerConfetti();
    }

    function updateGlobalProgress() {
        let total = 0, done = 0;
        state.rawSchedule.forEach((week, idx) => {
            week.subjects.forEach(sub => {
                if (state.settings.selectedSubjects.includes(sub.categoryName)) {
                     sub.topics.forEach(t => {
                        total++;
                        if (state.progress[`${week.id}-${sub.categoryName}-${t}`]) done++;
                     });
                }
            });
        });
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);
        const bar = document.getElementById('global-progress-bar');
        const text = document.getElementById('global-progress-text');
        if(bar) bar.style.width = `${percent}%`;
        if(text) text.innerText = `${percent}%`;
    }

    function goToCurrentPosition() {
        const today = new Date();
        today.setHours(0,0,0,0);
        let [d, m, y] = "30/11/2025".split('/');
        let start = new Date(y, m - 1, d);
        let diffTime = Math.abs(today - start);
        let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        let weekIdx = Math.floor(diffDays / 7);
        
        if (weekIdx < 0) weekIdx = 0;
        if (weekIdx >= state.rawSchedule.length) weekIdx = state.rawSchedule.length - 1;
        
        state.activeWeekIndex = weekIdx;
        renderApp();
    }

    // --- SETTINGS ---

    function renderSettingsModal() {
        const daysDiv = document.getElementById('days-container');
        daysDiv.innerHTML = '';
        WEEKDAYS.forEach((d, i) => {
            if (i === 0) return; 
            const isSelected = state.settings.studyDays.includes(i);
            daysDiv.innerHTML += `
                <label class="cursor-pointer select-none">
                    <input type="checkbox" class="peer sr-only" value="${i}" ${isSelected ? 'checked' : ''}>
                    <div class="h-10 rounded-lg border-2 border-slate-200 flex items-center justify-center text-sm font-bold text-slate-400 peer-checked:border-primary peer-checked:bg-primary peer-checked:text-white transition-all hover:border-primary/50">
                        ${d.substring(0,3)}
                    </div>
                </label>
            `;
        });
        const isSunSelected = state.settings.studyDays.includes(0);
        daysDiv.innerHTML += `
            <label class="cursor-pointer select-none">
                <input type="checkbox" class="peer sr-only" value="0" ${isSunSelected ? 'checked' : ''}>
                <div class="h-10 rounded-lg border-2 border-slate-200 flex items-center justify-center text-sm font-bold text-slate-400 peer-checked:border-primary peer-checked:bg-primary peer-checked:text-white transition-all hover:border-primary/50">
                    Dom
                </div>
            </label>
        `;

        const subsDiv = document.getElementById('subjects-container');
        subsDiv.innerHTML = '';
        ALL_SUBJECTS.forEach(sub => {
            const isSelected = state.settings.selectedSubjects.includes(sub);
            subsDiv.innerHTML += `
                <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-xl hover:bg-slate-100 transition-colors">
                    <input type="checkbox" value="${sub}" ${isSelected ? 'checked' : ''} class="w-4 h-4 text-primary rounded focus:ring-primary border-gray-300">
                    <span class="text-sm font-medium text-slate-700">${sub}</span>
                </label>
            `;
        });
        document.getElementById('user-name-input').value = state.settings.name;
        
        const bioRadios = document.getElementsByName('bio_teacher');
        bioRadios.forEach(r => {
            if (r.value === state.settings.bioTeacher) r.checked = true;
        });
    }

    function saveSettings() {
        state.settings.name = document.getElementById('user-name-input').value || "Vestibulando";
        const dayChecks = document.querySelectorAll('#days-container input:checked');
        state.settings.studyDays = Array.from(dayChecks).map(c => parseInt(c.value)).sort();
        
        if (state.settings.studyDays.length === 0) {
            alert("Selecione pelo menos um dia de estudo!");
            return;
        }

        const subChecks = document.querySelectorAll('#subjects-container input:checked');
        state.settings.selectedSubjects = Array.from(subChecks).map(c => c.value);
        
        const bioRadio = document.querySelector('input[name="bio_teacher"]:checked');
        if (bioRadio) state.settings.bioTeacher = bioRadio.value;
        
        state.calendarCache = {}; // Force Re-layout
        state.settings.hasVisited = true;
        saveState();
        toggleModal(false);
        renderApp();
    }

    function toggleModal(show) {
        const el = document.getElementById('settings-modal');
        if (show) {
            renderSettingsModal();
            el.classList.remove('hidden');
            setTimeout(() => el.classList.remove('opacity-0'), 10);
        } else {
            el.classList.add('opacity-0');
            setTimeout(() => el.classList.add('hidden'), 300);
        }
    }

    function openSettings() { toggleModal(true); }
    function closeSettings() { toggleModal(false); }

    function setTheme(color) {
        state.settings.theme = color;
        applyTheme(color);
    }
    function applyTheme(color) { document.body.setAttribute('data-theme', color); }

    function updateGreeting() {
        const h = new Date().getHours();
        const t = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
        document.getElementById('header-greeting').innerText = `${t}, ${state.settings.name.split(' ')[0]}`;
    }

    function triggerConfetti() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function toggleSidebar() {
        const s = document.getElementById('sidebar');
        const o = document.getElementById('sidebar-overlay');
        if (s.classList.contains('-translate-x-full')) {
            s.classList.remove('-translate-x-full');
            o.classList.remove('hidden');
        } else {
            s.classList.add('-translate-x-full');
            o.classList.add('hidden');
        }
    }

    function resetData() {
        if(confirm("Resetar tudo?")) {
            localStorage.removeItem('plannerv6_6_state');
            location.reload();
        }
    }

    init();
    </script>
</body>
